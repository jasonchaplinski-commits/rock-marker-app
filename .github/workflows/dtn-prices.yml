name: Weekly DTN fertilizer prices
on:
  schedule:
    - cron: "17 20 * * 3"
    - cron: "17 20 * * 5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read DTN prices
        run: python3 .github/scripts/dtn_prices.py
      - name: Save if changed
        run: |
          if [ -n "$(git status --porcelain dtn-prices.json)" ]; then
            git config user.name "dtn-price-bot"
            git config user.email "actions@users.noreply.github.com"
            git add dtn-prices.json
            git commit -m "DTN fertilizer prices: $(python3 -c 'import json;print(json.load(open("dtn-prices.json"))["week"])')"
            git push
          fi

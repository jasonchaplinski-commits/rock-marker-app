name: Training videos
on:
  push:
    branches: [main]
    paths: ['tools/tv/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji fonts-liberation
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: python tools/tv/run.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add videos/clip_map_v2.* videos/clip_field_v2.* videos/clip_harvest_v2.* videos/clip_shop_v2.* videos/clip_office_v2.* videos/clip_new.* videos/promo_phone_v2.* videos/promo_wide_v2.* videos/promo_poster_phone_v2.* videos/promo_poster_v2.*
          git commit -m "Training and promo videos refresh"
          git push
